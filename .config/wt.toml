[[pre-start]]
copy = """
primary=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")
if cmp -s "$primary/mix.lock" mix.lock && cmp -s "$primary/devenv.lock" devenv.lock; then
  wt step copy-ignored
fi
"""

[[pre-start]]
deps = "devenv shell -- env MIX_OS_DEPS_COMPILE_PARTITION_COUNT=1 mix deps.get"

[[pre-start]]
env = """
cat > .env.local <<'EOF'
PORT={% if branch == default_branch %}4004{% else %}{{ branch | hash_port }}{% endif %}
DB_PORT={% if branch == default_branch %}5436{% else %}{{ ('db-' ~ branch) | hash_port }}{% endif %}
S3_PORT={% if branch == default_branch %}8333{% else %}{{ ('s3-' ~ branch) | hash_port }}{% endif %}
BRANCH={{ branch }}
DATABASE_URL=ecto://postgres:postgres@localhost:{% if branch == default_branch %}5436{% else %}{{ ('db-' ~ branch) | hash_port }}{% endif %}/tcg_cheap_dev
EOF
echo "{% if branch == default_branch %}4004{% else %}{{ branch | hash_port }}{% endif %}" > .server.port
"""

[[pre-start]]
# T3 probes new listening ports with HTTP; Mix partition sockets are not HTTP.
dev = "devenv shell -- env MIX_OS_DEPS_COMPILE_PARTITION_COUNT=1 mix dev.up"

[[pre-remove]]
dev = "devenv shell -- mix dev.down"

[step.copy-ignored]
exclude = [".env.local", ".server.port"]

[list]
url = "http://localhost:{% if branch == default_branch %}4004{% else %}{{ branch | hash_port }}{% endif %}"
