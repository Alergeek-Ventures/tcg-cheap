services:
  # Keep this file to exactly one service: Podman Compose 1.6 cannot filter `ps -q` by service.
  postgres:
    image: docker.io/paradedb/paradedb:v0.25.2-pg18@sha256:f34b716407b4d509d3e59e649495964b296ad7c0931658dbf99d3cf1b35bc994
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pg_cron,pg_stat_statements
    environment:
      POSTGRES_DB: tcg_cheap_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    volumes:
      - tcg_cheap_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcg_cheap_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  tcg_cheap_postgres:
