name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-image:
    name: Validate database image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.database-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract and validate database image
        id: database-image
        shell: bash
        run: |
          set -euo pipefail
          image="$(awk '$1 == "image:" { print $2; exit }' local/compose.yml)"
          expected='docker.io/paradedb/paradedb:v0.26.4-pg18@sha256:4abbafffb4e59e679821c5882faf91c494022bb3242fc73b789e753f43df1361'
          test "$image" = "$expected"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

  check:
    name: Mix check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
      MIX_HOME: ${{ github.workspace }}/.mix

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.5
          otp-version: 29.1.2

      - name: Restore dependency and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            .mix
            ~/.cache/rebar3
          key: ${{ runner.os }}-elixir-1.20.5-otp-29.1.2-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-elixir-1.20.5-otp-29.1.2-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Restore PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-elixir-1.20.5-otp-29.1.2-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-elixir-1.20.5-otp-29.1.2-

      - name: Run canonical quality gate
        run: mix check --verbose

  container:
    name: Build application container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build application container
        run: docker build --file deployment/Containerfile.app --tag tcg-cheap:ci .

  deploy:
    name: Deploy production
    needs: [check, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Fetches prod:/app from Infisical over OIDC, syncs it to the Coolify
      # application, deploys (the app migrates as it starts) and waits.
      - name: Checkout AV secret service action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alergeek-Ventures/av-secret-service
          ssh-key: ${{ secrets.AV_SECRET_SERVICE_DEPLOY_KEY }}
          path: .av-secret-service
          ref: d1f0dd1864e3b1b5830459787057408b587434f6

      - name: Deploy to Coolify
        uses: ./.av-secret-service/coolify-deploy
        with:
          infisical-identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          infisical-project-slug: tcg-cheap
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          coolify-app-uuid: ${{ vars.COOLIFY_APP_UUID }}
          print-logs: false
