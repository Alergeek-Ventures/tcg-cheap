name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run, but not main's: cancelling it
# could stop a deploy halfway, or its rollback. Runs on main queue instead,
# and a newer push only replaces one still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  database-image:
    name: Validate database image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.database-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract and validate database image
        id: database-image
        shell: bash
        run: |
          set -euo pipefail
          image="$(awk '$1 == "image:" { print $2; exit }' local/compose.yml)"
          expected='docker.io/paradedb/paradedb:v0.26.4-pg18@sha256:4abbafffb4e59e679821c5882faf91c494022bb3242fc73b789e753f43df1361'
          test "$image" = "$expected"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

  check:
    name: Mix check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
      MIX_HOME: ${{ github.workspace }}/.mix

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and OTP
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.5
          otp-version: 29.1.2

      - name: Restore dependency and tool caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            .mix
            ~/.cache/rebar3
          key: deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # Cache each revision so later runs do not repeatedly restore an old build.
      # PLTs have their own lifecycle and must stay out of this cache.
      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/test/lib
            _build/test/.mix
            _build/test/consolidated
          key: build-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            build-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}-
            build-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Restore core PLT cache
        id: core-plt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/plts/core/*.plt
            _build/plts/core/*.plt.hash
          key: plt-core-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}

      - name: Restore project PLT cache
        id: plt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash
          key: plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}
          # Reuse only the same lock; changed dependencies start from the core PLTs.
          restore-keys: |
            plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}-

      - name: Create or update PLTs
        id: plt-create
        if: steps.core-plt-cache.outputs.cache-hit != 'true' || steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      # Preserve successful PLT creation even if the quality gate later fails.
      - name: Save core PLT cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.core-plt-cache.outputs.cache-hit != 'true' && steps.plt-create.outcome == 'success'
        with:
          path: |
            _build/plts/core/*.plt
            _build/plts/core/*.plt.hash
          key: ${{ steps.core-plt-cache.outputs.cache-primary-key }}

      - name: Save project PLT cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.plt-cache.outputs.cache-hit != 'true' && steps.plt-create.outcome == 'success'
        with:
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}

      - name: Run canonical quality gate
        run: mix check --verbose

  # Coolify builds the deployed image itself, so deploys do not wait for this
  # job; on main it also warms the layer cache that pull requests restore.
  container:
    name: Build application container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          # The hosted runner is discarded after the job; no builder cleanup is needed.
          cleanup: false

      - name: Build application container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/Containerfile.app
          push: false
          # Validate the complete build without exporting an unused image.
          outputs: type=cacheonly
          cache-from: type=gha,scope=tcg-cheap-app
          # Cache export is optional; image build failures remain fatal.
          cache-to: type=gha,scope=tcg-cheap-app,mode=max,ignore-error=true

  sentry-release:
    name: Create Sentry release
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Verify Sentry token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN must be configured in the production environment}"

      # Full history lets Sentry associate the release with its commits.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The release is the commit Coolify deploys next (SOURCE_COMMIT at runtime).
      - name: Create and finalize Sentry release
        uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'alergeek' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'tcg-cheap' }}
        with:
          environment: production
          release: ${{ github.sha }}

  deploy:
    name: Deploy production
    needs: [check, sentry-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      COOLIFY_API: ${{ secrets.COOLIFY_API }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # The revision to roll back to: the running one, once its pages pass
      # the same check, so a rollback never goes back to a broken release.
      # Also lists Coolify's rollback images on every deploy, so a broken
      # rollback path shows up as a warning before the day it is needed.
      - name: Record the running revision
        id: running
        timeout-minutes: 10
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          revision="$(curl -fsS --retry 3 --max-time 10 https://tcg.cheap/health/live | jq -r .revision || true)"

          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::Production reports no revision (${revision:-no answer}); a broken release cannot be rolled back"
            exit 0
          fi

          if bash .github/scripts/check-production.sh "$revision"; then
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The running revision $revision fails the page check; a broken release cannot be rolled back"
          fi

          if ! tags="$(curl -fsS --retry 3 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_API/applications/$COOLIFY_APP_UUID/rollback-images" | jq -r '.images[].tag')"; then
            echo "::warning::Coolify did not list its rollback images"
          elif ! grep -qx "$revision" <<<"$tags"; then
            echo "::warning::Coolify holds no image of $revision to roll back to"
          fi

      # Fetches prod:/app from Infisical over OIDC, syncs it to the Coolify
      # application, deploys (the app migrates as it starts) and waits.
      - name: Checkout AV secret service action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Alergeek-Ventures/av-secret-service
          ssh-key: ${{ secrets.AV_SECRET_SERVICE_DEPLOY_KEY }}
          path: .av-secret-service
          ref: d1f0dd1864e3b1b5830459787057408b587434f6

      - name: Deploy to Coolify
        id: deploy
        uses: ./.av-secret-service/coolify-deploy
        with:
          infisical-identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          infisical-project-slug: tcg-cheap
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          coolify-app-uuid: ${{ vars.COOLIFY_APP_UUID }}
          print-logs: false

      # Coolify's health check passes a release whose pages answer 500.
      # Exit code 1 means a page is broken, 2 that the check could not tell.
      # Coolify builds main's head, which is newer than this run's commit
      # when a push came in while this run waited or checked.
      - name: Check production pages
        id: pages
        timeout-minutes: 10
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-uuid }}
        run: |
          deployed="$(curl -fsS --retry 3 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_API/deployments/$DEPLOYMENT" | jq -r .commit || true)"

          if ! [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::Coolify names no commit for its deployment (${deployed:-no answer}); expecting $GITHUB_SHA"
            deployed="$GITHUB_SHA"
          fi

          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          code=0
          bash .github/scripts/check-production.sh "$deployed" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Puts back the image of the revision that ran before, with the current
      # configuration, and leaves the job failed. The database stays migrated:
      # Coolify restores code, not data.
      - name: Roll back to the running revision
        if: >-
          failure() && steps.pages.outputs.code == '1' &&
          steps.running.outputs.revision != '' && steps.running.outputs.revision != steps.pages.outputs.deployed
        timeout-minutes: 20
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PREVIOUS: ${{ steps.running.outputs.revision }}
        run: |
          echo "::error::Rolling production back to $PREVIOUS"

          # Not retried: a repeated POST could queue a second rollback.
          deployment="$(curl -fsS --max-time 60 -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"commit\": \"$PREVIOUS\"}" \
            "$COOLIFY_API/applications/$COOLIFY_APP_UUID/rollback" | jq -r .deployment_uuid || true)"

          if [ -z "$deployment" ] || [ "$deployment" = null ]; then
            echo "::error::Coolify did not queue the rollback; roll back by hand in Coolify"
            exit 1
          fi

          deadline=$((SECONDS + 600))

          while true; do
            status="$(curl -fsS --retry 3 --max-time 30 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_API/deployments/$deployment" | jq -r .status || true)"
            echo "Coolify rollback: ${status:-no answer}"

            case "$status" in
              finished | success) break ;;
              failed | error | cancelled*)
                echo "::error::Coolify rollback $deployment ended $status"
                exit 1
                ;;
            esac

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Coolify rollback $deployment did not finish in time"
              exit 1
            fi

            sleep 5
          done

          if ! bash .github/scripts/check-production.sh "$PREVIOUS"; then
            echo "::error::$PREVIOUS fails the page check after the rollback; a migration of the broken release may not suit it"
            exit 1
          fi
